[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "3d-kenji"
version = "0.0.0"
description = "3DKenji API-first web app"
authors = [ { name = "bodybybuddha" } ]
readme = "README.md"
requires-python = ">=3.11"

dependencies = [
  "fastapi==0.101.1",
  "uvicorn[standard]==0.22.0",
  "SQLAlchemy==2.0.20",
  "alembic==1.11.1",
  "psycopg[binary]==3.2.9",
  "pydantic==1.10.11",
  "python-multipart==0.0.6",
  "authlib==1.2.0",
  "jinja2==3.1.2",
  "flask==2.2.5",
  "pytest==7.3.2",
  "httpx==0.24.1",
  "pytest-asyncio==0.21.0",
]
