[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "3dkenji"
version = "1.0.0"
description = "3D Kenji: Self-hosted knowledge keeper for 3D printing projects."
authors = [ { name = "bodybybuddha" } ]
readme = "README.md"
requires-python = ">=3.11"

dependencies = [
  "fastapi==0.115.0",
  "uvicorn[standard]==0.32.1",
  "SQLAlchemy==2.0.20",
  "alembic==1.11.1",
  "psycopg[binary]==3.2.9",
  "pydantic~=2.0",
  "python-multipart==0.0.6",
  "authlib==1.2.0",
  "jinja2==3.1.2",
  "pytest>=7.3.2",
  "httpx==0.24.1",
  "pytest-asyncio==0.21.0",
  "pytest-cov>=4.0.0",
  "pluggy>=1.6.0",
  "bcrypt==4.1.2",
  "pyjwt>=2.8.0",
  "email-validator==2.1.0",
]

[project.entry-points."3dkenji.plugins"]
# Built-in plugins will be registered here
# Example: password_auth = "backend.plugins.auth_password:PasswordAuthProvider"

[tool.setuptools.packages.find]
where = ["src"]
include = ["*"]

