<!-- HTMX validation error display -->
<div class="alert alert-error" role="alert">
    <div class="alert-content">
        <p class="alert-message">{{ message or 'Validation failed' }}</p>
        {% if errors %}
        <ul style="margin: var(--spacing-md) 0 0 0; padding-left: var(--spacing-lg);">
            {% for field, messages in errors.items() %}
            <li style="margin: var(--spacing-xs) 0;">
                <strong>{{ field }}:</strong>
                {% if messages | length == 1 %}
                {{ messages[0] }}
                {% else %}
                <ul style="margin: var(--spacing-xs) 0 0 var(--spacing-md);">
                    {% for msg in messages %}
                    <li>{{ msg }}</li>
                    {% endfor %}
                </ul>
                {% endif %}
            </li>
            {% endfor %}
        </ul>
        {% endif %}
    </div>
    <button class="alert-close" role="button" aria-label="Close">&times;</button>
</div>

<script>
    // Make error alert dismissible
    document.querySelectorAll('.alert-close').forEach((button) => {
        button.addEventListener('click', function () {
            this.closest('.alert').remove();
        });
    });
</script>
