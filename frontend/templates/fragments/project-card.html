<div class="project-card" hx-target="nearest .project-card">
    <div style="padding: var(--spacing-lg);">
        <div
            style="display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: var(--spacing-md);">
            <div>
                <h3 style="margin: 0 0 var(--spacing-xs) 0;">{{ project.name }}</h3>
                <p class="section-description" style="margin: 0;">{{ project.description or 'No description' }}</p>
            </div>
            <div style="display: flex; gap: var(--spacing-sm);">
                <button class="btn btn-sm btn-secondary" hx-get="/projects/{{ project.id }}/edit-modal" hx-target="body"
                    hx-swap="beforeend" title="Edit">
                    ✏️
                </button>
                <button class="btn btn-sm btn-danger" hx-delete="/api/v1/projects/{{ project.id }}"
                    hx-confirm="Are you sure?" hx-target="nearest .project-card" hx-swap="swap 1s" title="Delete">
                    🗑️
                </button>
            </div>
        </div>

        <div
            style="display: grid; grid-template-columns: 2fr 1fr 1fr; gap: var(--spacing-md); font-size: 0.875rem; color: var(--text-secondary); padding-top: var(--spacing-md); border-top: 1px solid var(--border-color);">
            <div>
                <span style="font-weight: 600;">Models:</span> {{ project.model_count or 0 }}
            </div>
            <div>
                <span style="font-weight: 600;">Size:</span> {{ project.total_size or '0 B' }}
            </div>
            <div>
                <span style="font-weight: 600;">Created:</span> {{ project.created_at | timeago }}
            </div>
        </div>

        <div style="margin-top: var(--spacing-lg);">
            <a href="/project/{{ project.id }}" class="btn btn-primary" style="display: inline-block;">
                View Project →
            </a>
        </div>
    </div>
</div>
