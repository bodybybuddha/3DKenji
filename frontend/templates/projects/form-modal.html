<div id="project-form-modal" class="modal" style="display: flex; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); align-items: center; justify-content: center; z-index: 1000;">
  <div class="card" style="max-width: 500px; width: 90%;">
    <div style="padding: var(--spacing-lg); border-bottom: 1px solid var(--border-color); display: flex; justify-content: space-between; align-items: center;">
      <h2 id="modal-title" style="margin: 0;">Create Project</h2>
      <button hx-on="click: this.closest('#project-form-modal').remove()" style="background: none; border: none; font-size: 1.5rem; cursor: pointer; color: var(--text-secondary);">
        ×
      </button>
    </div>

    <form id="project-form" hx-post="/api/v1/projects" hx-swap="outerHTML">
      <div style="padding: var(--spacing-lg); display: grid; gap: var(--spacing-md);">
        <input type="hidden" name="project_id" id="project_id" />

        <div>
          <label for="project_name">Project Name *</label>
          <input type="text" id="project_name" name="name" placeholder="My Awesome Project" required class="form-control" />
        </div>

        <div>
          <label for="project_description">Description</label>
          <textarea id="project_description" name="description" placeholder="Describe your project..." rows="4" class="form-control"></textarea>
        </div>

        <div>
          <label for="project_visibility">Visibility</label>
          <select id="project_visibility" name="visibility" class="form-control">
            <option value="private">Private</option>
            <option value="public">Public</option>
          </select>
        </div>

        <div>
          <label for="project_tags">Tags (comma-separated, optional)</label>
          <input type="text" id="project_tags" name="tags" placeholder="ml, vision, classification" class="form-control" />
        </div>
      </div>

      <div style="padding: var(--spacing-lg); border-top: 1px solid var(--border-color); display: flex; gap: var(--spacing-md); justify-content: flex-end;">
        <button type="button" class="btn btn-secondary" onclick="this.closest('#project-form-modal').remove();">
          Cancel
        </button>
        <button type="submit" class="btn btn-primary" id="submit-btn">
          Create Project
        </button>
      </div>
    </form>
  </div>
</div>

<script>
// Check if we're editing by looking for project data
const projectId = document.getElementById('project_id').value;
if (projectId) {
  document.getElementById('modal-title').textContent = 'Edit Project';
  document.getElementById('submit-btn').textContent = 'Save Changes';
  document.getElementById('project-form').setAttribute('hx-put', '/api/v1/projects/' + projectId);
}

// Form submission handler
document.getElementById('project-form').addEventListener('htmx:afterRequest', function(event) {
  if (event.detail.xhr.status === 200 || event.detail.xhr.status === 201) {
    HTMXHelper.showToast('Project ' + (projectId ? 'updated' : 'created') + ' successfully', 'success');
    setTimeout(() => {
      document.getElementById('project-form-modal').remove();
      htmx.ajax('GET', '/projects', 'body');
    }, 1500);
  }
});
</script>
