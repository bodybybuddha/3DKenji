{% extends "base.html" %}

{% block title %}Admin Dashboard - 3DKenji{% endblock %}

{% block content %}
<div class="admin-layout"
    style="display: grid; grid-template-columns: 250px 1fr; gap: var(--spacing-xl); min-height: calc(100vh - 60px);">
    <!-- Admin Sidebar -->
    <aside
        style="background-color: var(--bg-secondary); border-right: 1px solid var(--border-color); padding: var(--spacing-lg);">
        <nav style="display: flex; flex-direction: column; gap: var(--spacing-sm);">
            <a href="/admin" class="admin-nav-link"
                style="display: block; padding: var(--spacing-md) var(--spacing-lg); border-radius: var(--radius-md); color: var(--text-primary); text-decoration: none; transition: all var(--transition-fast);">
                📊 Dashboard
            </a>
            <a href="/admin/users" class="admin-nav-link"
                style="display: block; padding: var(--spacing-md) var(--spacing-lg); border-radius: var(--radius-md); color: var(--text-primary); text-decoration: none; transition: all var(--transition-fast);">
                👥 Users
            </a>
            <a href="/admin/plugins" class="admin-nav-link"
                style="display: block; padding: var(--spacing-md) var(--spacing-lg); border-radius: var(--radius-md); color: var(--text-primary); text-decoration: none; transition: all var(--transition-fast);">
                🔌 Plugins
            </a>
            <a href="/admin/settings" class="admin-nav-link"
                style="display: block; padding: var(--spacing-md) var(--spacing-lg); border-radius: var(--radius-md); color: var(--text-primary); text-decoration: none; transition: all var(--transition-fast);">
                ⚙️ Settings
            </a>
            <a href="/admin/logs" class="admin-nav-link"
                style="display: block; padding: var(--spacing-md) var(--spacing-lg); border-radius: var(--radius-md); color: var(--text-primary); text-decoration: none; transition: all var(--transition-fast);">
                📋 Logs
            </a>
            <a href="/admin/health" class="admin-nav-link"
                style="display: block; padding: var(--spacing-md) var(--spacing-lg); border-radius: var(--radius-md); color: var(--text-primary); text-decoration: none; transition: all var(--transition-fast);">
                💚 Health
            </a>
            <hr style="margin: var(--spacing-lg) 0;" />
            <a href="/"
                style="display: block; padding: var(--spacing-md) var(--spacing-lg); border-radius: var(--radius-md); color: var(--text-secondary); text-decoration: none; transition: all var(--transition-fast);">
                ← Back to App
            </a>
        </nav>
    </aside>

    <!-- Main Content -->
    <main style="padding: var(--spacing-lg);">
        {% block admin_content %}{% endblock %}
    </main>
</div>

<style>
    .admin-nav-link:hover {
        background-color: var(--bg-tertiary);
        color: var(--color-primary);
    }

    .admin-nav-link.active {
        background-color: var(--color-primary);
        color: white;
    }

    @media (max-width: 768px) {
        .admin-layout {
            grid-template-columns: 1fr;
        }

        aside {
            display: none;
        }
    }
</style>
{% endblock %}
