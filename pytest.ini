[pytest]
minversion = 7.0
addopts = -ra -q
testpaths = tests
asyncio_mode = auto

# Markers for organizing tests
markers =
    smoke: Critical path smoke tests
    security: Security-focused tests
    slow: Slow-running tests
    e2e: End-to-end browser tests
    integration: Integration tests requiring a live database (PostgreSQL)

# Coverage settings
[coverage:run]
source = src/backend
omit = 
    */tests/*
    */__pycache__/*
    */migrations/*

[coverage:report]
exclude_lines =
    pragma: no cover
    def __repr__
    raise AssertionError
    raise NotImplementedError
    if __name__ == .__main__.:
    if TYPE_CHECKING:
    @abstractmethod
