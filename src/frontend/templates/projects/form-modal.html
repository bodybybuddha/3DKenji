<div id="project-form-modal" class="modal"
    style="display: flex; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); align-items: center; justify-content: center; z-index: 1000;">
    <div class="card" style="max-width: 500px; width: 90%;">
        <div
            style="padding: var(--spacing-lg); border-bottom: 1px solid var(--border-color); display: flex; justify-content: space-between; align-items: center;">
            <h2 id="modal-title" style="margin: 0;">{% if project %}Edit Project{% else %}Create Project{% endif %}</h2>
            <button hx-on="click: this.closest('#project-form-modal').remove()"
                style="background: none; border: none; font-size: 1.5rem; cursor: pointer; color: var(--text-secondary);">
                ×
            </button>
        </div>

        <div id="project-form-alert" style="padding: var(--spacing-md) var(--spacing-lg) 0 var(--spacing-lg);"></div>

        <form id="project-form" {% if project %}hx-put="/api/v1/projects/{{ project.id }}" {% else
            %}hx-post="/api/v1/projects" {% endif %} hx-target="#project-form-alert" hx-swap="innerHTML">
            <div style="padding: var(--spacing-lg); display: grid; gap: var(--spacing-md);">
                <input type="hidden" name="project_id" id="project_id"
                    value="{% if project %}{{ project.id }}{% endif %}" />

                <div>
                    <label for="project_name">Project Name *</label>
                    <input type="text" id="project_name" name="name" placeholder="My Awesome Project" required
                        class="form-control" value="{% if project %}{{ project.title }}{% endif %}" />
                </div>

                {% if not project %}
                <div>
                    <label for="project_description">Description</label>
                    <textarea id="project_description" name="description" placeholder="Describe your project..."
                        rows="4" class="form-control"></textarea>
                </div>
                {% endif %}

                <div>
                    <label for="project_visibility">Visibility</label>
                    <select id="project_visibility" name="visibility" class="form-control">
                        <option value="private" {% if project and project.category=='private' %}selected{% endif %}>
                            Private</option>
                        <option value="public" {% if project and project.category=='public' %}selected{% endif %}>Public
                        </option>
                    </select>
                </div>

                {% if not project %}
                <div>
                    <label for="project_tags">Tags (comma-separated, optional)</label>
                    <input type="text" id="project_tags" name="tags" placeholder="ml, vision, classification"
                        class="form-control" />
                </div>
                {% else %}
                <div>
                    <p style="margin: 0; font-size: 0.875rem; color: var(--text-secondary);">
                        This version stores project name and visibility. Description and tags are not persisted yet.
                    </p>
                </div>
                {% endif %}
            </div>

            <div
                style="padding: var(--spacing-lg); border-top: 1px solid var(--border-color); display: flex; gap: var(--spacing-md); justify-content: flex-end;">
                <button type="button" class="btn btn-secondary" onclick="this.closest('#project-form-modal').remove();">
                    Cancel
                </button>
                <button type="submit" class="btn btn-primary" id="submit-btn">
                    {% if project %}Save Changes{% else %}Create Project{% endif %}
                </button>
            </div>
        </form>
    </div>
</div>

<script>
    const projectForm = document.getElementById('project-form');
    const projectId = document.getElementById('project_id').value;

    // Form submission handler
    projectForm.addEventListener('htmx:afterRequest', function (event) {
        if (event.detail.xhr.status === 201 || event.detail.xhr.status === 200) {
            HTMXHelper.showToast('Project ' + (projectId ? 'updated' : 'created') + ' successfully', 'success');
            setTimeout(() => {
                const modal = document.getElementById('project-form-modal');
                if (modal) modal.remove();

                const projectsList = document.getElementById('projects-list');
                if (projectsList) {
                    htmx.ajax('GET', '/api/v1/projects?format=html', '#projects-list');
                } else {
                    window.location.href = '/projects';
                }
            }, 1500);
        }
    });

    // Handle HTMX errors
    projectForm.addEventListener('htmx:responseError', function (event) {
        if (event.detail.xhr.status >= 400) {
            HTMXHelper.showToast('Error: ' + (event.detail.xhr.statusText || 'Failed to save project'), 'danger');
        }
    });
</script>
