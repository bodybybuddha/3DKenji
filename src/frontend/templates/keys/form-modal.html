<div id="api-key-modal" class="modal"
    style="display: flex; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); align-items: center; justify-content: center; z-index: 1000;">
    <div class="card" style="max-width: 500px; width: 90%;">
        <div
            style="padding: var(--spacing-lg); border-bottom: 1px solid var(--border-color); display: flex; justify-content: space-between; align-items: center;">
            <h2 style="margin: 0;">Generate API Key</h2>
            <button hx-on="click: this.closest('#api-key-modal').remove()"
                style="background: none; border: none; font-size: 1.5rem; cursor: pointer; color: var(--text-secondary);">
                ×
            </button>
        </div>

        <form hx-post="/api/v1/keys" hx-swap="outerHTML">
            <div style="padding: var(--spacing-lg); display: grid; gap: var(--spacing-md);">
                <div>
                    <label for="key_name">Key Name *</label>
                    <input type="text" id="key_name" name="name" placeholder="e.g., CLI Tool, Mobile App" required
                        class="form-control" />
                </div>

                <div>
                    <label for="key_scopes">Scopes *</label>
                    <div
                        style="display: grid; grid-template-columns: 1fr 1fr; gap: var(--spacing-sm); margin-top: var(--spacing-sm);">
                        <label style="display: flex; align-items: center; gap: var(--spacing-sm);">
                            <input type="checkbox" name="scopes" value="read:models" /> Read Models
                        </label>
                        <label style="display: flex; align-items: center; gap: var(--spacing-sm);">
                            <input type="checkbox" name="scopes" value="write:models" /> Upload Models
                        </label>
                        <label style="display: flex; align-items: center; gap: var(--spacing-sm);">
                            <input type="checkbox" name="scopes" value="read:projects" /> Read Projects
                        </label>
                        <label style="display: flex; align-items: center; gap: var(--spacing-sm);">
                            <input type="checkbox" name="scopes" value="write:projects" /> Manage Projects
                        </label>
                        <label style="display: flex; align-items: center; gap: var(--spacing-sm);">
                            <input type="checkbox" name="scopes" value="read:settings" /> Read Settings
                        </label>
                        <label style="display: flex; align-items: center; gap: var(--spacing-sm);">
                            <input type="checkbox" name="scopes" value="write:settings" /> Manage Settings
                        </label>
                    </div>
                </div>

                <div>
                    <label>Expiration</label>
                    <div style="display: grid; gap: var(--spacing-sm); margin-top: var(--spacing-sm);">
                        <label style="display: flex; align-items: center; gap: var(--spacing-sm);">
                            <input type="radio" name="expiry_mode" value="never" checked
                                onchange="document.getElementById('expiry_date_row').style.display='none';document.getElementById('expire_on').value='';" />
                            No expiration
                        </label>
                        <label style="display: flex; align-items: center; gap: var(--spacing-sm);">
                            <input type="radio" name="expiry_mode" value="date"
                                onchange="document.getElementById('expiry_date_row').style.display='block';" />
                            Set expiration date
                        </label>
                    </div>
                    <div id="expiry_date_row" style="display: none; margin-top: var(--spacing-sm);">
                        <input type="date" id="expire_on" name="expire_on" class="form-control"
                            min="{{ today }}"
                            placeholder="YYYY-MM-DD" />
                        <small style="color: var(--text-secondary);">Key will become invalid after this date.</small>
                    </div>
                </div>

                <div style="background: var(--bg-secondary); padding: var(--spacing-md); border-radius: 4px;">
                    <p style="font-size: 0.875rem; color: var(--text-secondary); margin: 0;">
                        ℹ️ The api key will be displayed only once. Save it to a secure location.
                    </p>
                </div>
            </div>

            <div
                style="padding: var(--spacing-lg); border-top: 1px solid var(--border-color); display: flex; gap: var(--spacing-md); justify-content: flex-end;">
                <button type="button" class="btn btn-secondary" onclick="this.closest('#api-key-modal').remove();">
                    Cancel
                </button>
                <button type="submit" class="btn btn-primary">
                    Generate Key
                </button>
            </div>
        </form>
    </div>
</div>

<script>
    document.querySelector('#api-key-modal form').addEventListener('htmx:afterRequest', function (event) {
        if (event.detail.xhr.status === 201) {
            const response = JSON.parse(event.detail.xhr.responseText);

            // Show the newly generated key
            const keyDisplay = document.createElement('div');
            keyDisplay.id = 'api-key-display';
            keyDisplay.className = 'card';
            keyDisplay.innerHTML = `
      <div style="padding: var(--spacing-lg);">
        <h3>API Key Generated</h3>
        <p style="color: var(--text-secondary);">Save this key in a safe place. You won't be able to see it again.</p>
        <div style="background: var(--bg-secondary); padding: var(--spacing-lg); border-radius: 4px; margin: var(--spacing-lg) 0; font-family: monospace; word-break: break-all;">
          ${response.key}
        </div>
        <button class="btn btn-secondary" onclick="navigator.clipboard.writeText('${response.key}'); HTMXHelper.showToast('Copied to clipboard', 'success');">
          Copy to Clipboard
        </button>
        <button class="btn btn-primary" onclick="this.closest('div').remove(); document.getElementById('api-key-modal').remove();" style="margin-left: var(--spacing-md);">
          Done
        </button>
      </div>
    `;
            document.body.appendChild(keyDisplay);
            this.closest('#api-key-modal').remove();
        }
    });
</script>
