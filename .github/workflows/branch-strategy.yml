---
name: Branch Strategy

on:
  pull_request:
    branches: [ main, dev ]

permissions:
  contents: read

jobs:
  validate:
    name: Validate Branch Strategy
    runs-on: ubuntu-latest

    steps:
      - name: Enforce allowed PR flow
        env:
          BASE_REF: ${{ github.base_ref }}
          HEAD_REF: ${{ github.head_ref }}
        run: |
          echo "Validating PR flow: ${HEAD_REF} -> ${BASE_REF}"

          if [[ "$BASE_REF" == "dev" ]]; then
            if [[ "$HEAD_REF" == feature/* ]]; then
              echo "PR flow accepted: feature/* -> dev"
              exit 0
            fi

            echo "Only feature/* branches may target dev. Received: ${HEAD_REF} -> ${BASE_REF}" >&2
            exit 1
          fi

          if [[ "$BASE_REF" == "main" ]]; then
            if [[ "$HEAD_REF" == "dev" ]]; then
              echo "PR flow accepted: dev -> main"
              exit 0
            fi

            echo "Only the dev branch may target main. Received: ${HEAD_REF} -> ${BASE_REF}" >&2
            exit 1
          fi

          echo "Unsupported PR target branch: ${BASE_REF}" >&2
          exit 1