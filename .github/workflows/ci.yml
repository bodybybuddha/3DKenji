name: CI

on:
  push:
    branches: [ main, dev ]
  pull_request:
    branches: [ main, dev ]

jobs:
  changes:
    name: Detect Relevant Changes
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.filter.outputs.code }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Detect code-impacting changes
        id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            code:
              - "src/**"
              - "tests/**"
              - "migrations/**"
              - "pyproject.toml"
              - "pytest.ini"
              - "alembic.ini"
              - "Dockerfile"
              - "docker-compose.yml"

  test:
    name: Run Tests
    runs-on: ubuntu-latest
    needs: changes

    steps:
      - name: No code-impacting changes
        if: needs.changes.outputs.code != 'true'
        run: echo "No code-impacting changes detected; required test check passes without running pytest."

      - name: Checkout code
        if: needs.changes.outputs.code == 'true'
        uses: actions/checkout@v4
      
      - name: Set up Python 3.11
        if: needs.changes.outputs.code == 'true'
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
          cache: 'pip'
      
      - name: Cache uv
        if: needs.changes.outputs.code == 'true'
        uses: actions/cache@v3
        with:
          path: ~/.cache/uv
          key: ${{ runner.os }}-uv-${{ hashFiles('**/uv.lock') }}
          restore-keys: |
            ${{ runner.os }}-uv-
      
      - name: Install uv and dependencies
        if: needs.changes.outputs.code == 'true'
        run: |
          python -m pip install --upgrade pip
          pip install uv==0.8.15
          uv venv --python 3.11
          . .venv/bin/activate
          uv pip install -e ".[dev]"
      
      - name: Create data directories
        if: needs.changes.outputs.code == 'true'
        run: |
          mkdir -p data/logs data/storage/projects data/storage/tmp
      
      - name: Run pytest with coverage
        if: needs.changes.outputs.code == 'true'
        run: |
          . .venv/bin/activate
          # TODO: Fix contract tests in follow-up PR (known environment config issue)
          uv run pytest -v --cov=src --cov-report=term-missing --ignore=tests/contract/ --ignore=tests/e2e/
        env:
          ENABLE_FILE_LOGGING: "false"
      
      - name: Check test count
        if: needs.changes.outputs.code == 'true'
        run: |
          . .venv/bin/activate
          TEST_COUNT=$(uv run pytest --collect-only -q --ignore=tests/contract/ --ignore=tests/e2e/ | tail -n 1 | awk '{print $1}')
          echo "Total tests found: $TEST_COUNT"
          if [ "$TEST_COUNT" -lt 43 ]; then
            echo "⚠️  Warning: Expected at least 43 tests, found $TEST_COUNT"
          fi
  
  lint:
    name: Code Quality
    runs-on: ubuntu-latest
    needs: changes

    steps:
      - name: No code-impacting changes
        if: needs.changes.outputs.code != 'true'
        run: echo "No code-impacting changes detected; required lint check passes without running static analysis."

      - name: Checkout code
        if: needs.changes.outputs.code == 'true'
        uses: actions/checkout@v4
      
      - name: Set up Python 3.11
        if: needs.changes.outputs.code == 'true'
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      
      - name: Install linting tools
        if: needs.changes.outputs.code == 'true'
        run: |
          python -m pip install --upgrade pip
          pip install ruff mypy
      
      - name: Run ruff (fast linter/formatter)
        if: needs.changes.outputs.code == 'true'
        run: |
          ruff check src/ tests/ --output-format=github
        continue-on-error: true
      
      - name: Check Python formatting
        if: needs.changes.outputs.code == 'true'
        run: |
          ruff format --check src/ tests/
        continue-on-error: true
