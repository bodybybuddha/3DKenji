name: CI

on:
  push:
    branches: [ main, dev, "feature/**" ]
  pull_request:
    branches: [ main, dev ]

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Python 3.11
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
          cache: 'pip'
      
      - name: Cache uv
        uses: actions/cache@v3
        with:
          path: ~/.cache/uv
          key: ${{ runner.os }}-uv-${{ hashFiles('**/uv.lock') }}
          restore-keys: |
            ${{ runner.os }}-uv-
      
      - name: Install uv and dependencies
        run: |
          python -m pip install --upgrade pip
          pip install uv==0.8.15
          uv venv --python 3.11
          . .venv/bin/activate
          uv pip install -e ".[dev]"
      
      - name: Create data directories
        run: |
          mkdir -p data/logs data/storage/projects data/storage/tmp
      
      - name: Run pytest with coverage
        run: |
          . .venv/bin/activate
          uv run pytest -v --cov=src --cov-report=term-missing
        env:
          ENABLE_FILE_LOGGING: "false"
      
      - name: Check test count
        run: |
          . .venv/bin/activate
          TEST_COUNT=$(uv run pytest --collect-only -q | tail -n 1 | awk '{print $1}')
          echo "Total tests found: $TEST_COUNT"
          if [ "$TEST_COUNT" -lt 52 ]; then
            echo "⚠️  Warning: Expected at least 52 tests, found $TEST_COUNT"
          fi
  
  lint:
    name: Code Quality
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Python 3.11
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      
      - name: Install linting tools
        run: |
          python -m pip install --upgrade pip
          pip install ruff mypy
      
      - name: Run ruff (fast linter/formatter)
        run: |
          ruff check src/ tests/ --output-format=github
        continue-on-error: true
      
      - name: Check Python formatting
        run: |
          ruff format --check src/ tests/
        continue-on-error: true
