name: CI

on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: kenji
          POSTGRES_PASSWORD: kenji
          POSTGRES_DB: kenji
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      - name: Install uv and prepare venv
        run: |
          python -m pip install --upgrade pip
          pip install uv==0.8.15
          uv venv --python 3.11
          . .venv/bin/activate
          uv pip sync
      - name: Run tests
        run: |
          . .venv/bin/activate
          uv run pytest -q
