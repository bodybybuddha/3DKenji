services:
  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: kenji
      POSTGRES_PASSWORD: kenji
      POSTGRES_DB: kenji
    volumes:
      - ../data/db_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  backend:
    build:
      context: ..
      dockerfile: .devcontainer/Dockerfile
    volumes:
      - ..:/workspace:cached
      - ${HOME}/.gitconfig:/home/vscode/.gitconfig
      - ${HOME}/.ssh/id_rsa:/home/vscode/.ssh/id_rsa
      - venv_data:/workspace/.venv
    environment:
      DATABASE_URL: postgres://kenji:kenji@db:5432/kenji
    depends_on:
      - db
    ports:
      - "8000:8000"

volumes:
  db_data:
  venv_data:
